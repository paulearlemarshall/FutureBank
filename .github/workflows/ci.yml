name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://futurebank:futurebank@127.0.0.1:5432/futurebank
      BETTER_AUTH_SECRET: ci-only-futurebank-secret-with-at-least-32-characters
      DEMO_OPERATOR_PASSWORD: ci-only-operator-password
      DEMO_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
