name: CI

on:
  push:
    branches: [main, "agent/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: futurebank
          POSTGRES_PASSWORD: futurebank
          POSTGRES_DB: futurebank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futurebank -d futurebank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://futurebank:futurebank@127.0.0.1:5432/futurebank
      BETTER_AUTH_SECRET: ci-only-futurebank-secret-with-at-least-32-characters
      DEMO_OPERATOR_PASSWORD: ci-only-operator-password
      DEMO_SUPERVISOR_PASSWORD: ci-only-supervisor-password
      DEMO_COMPLIANCE_PASSWORD: ci-only-compliance-password
      DEMO_ADMIN_PASSWORD: ci-only-admin-password
      FUTUREBANK_API_KEY: ci-only-futurebank-api-key
      FUTUREBANK_API_DEFAULT_USERNAME: bp.operator
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      FUTUREBANK_BLOB_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit migrate
      - run: npx tsx scripts/reset.ts
      - run: npx tsx scripts/verify-db.ts
      - run: node --conditions=react-server --import tsx scripts/verify-workflows.ts
      - run: npx tsx scripts/verify-db.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium msedge
      - run: npm run test:e2e
      - name: Clean customer document Blob namespace
        if: always()
        run: npx tsx scripts/cleanup-document-blobs.ts
